name: Temporary dependency lockfile refresh
on:
  push:
    branches: [improve/security-dogs-ui-20261118]
permissions:
  contents: write
jobs:
  refresh-lock:
    if: contains(github.event.head_commit.message, 'Prepare dependency lockfile refresh')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - name: Recreate lockfile without executing package scripts
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
          npm audit --json > dependency-audit.json || true
          npm audit --omit=dev --json > dependency-audit-production.json || true
      - name: Publish lockfile and advisory reports as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lockfile-refresh-${{ github.run_number }}
          path: |
            package.json
            package-lock.json
            dependency-audit.json
            dependency-audit-production.json
          retention-days: 7

  commit-lock:
    if: contains(github.event.head_commit.message, 'Apply dependency lockfile refresh')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - name: Resolve dependency graph without running install scripts
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
      - name: Commit lockfile to this feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): regenerate tested Astro 7.4.12 lockfile"
            git push origin HEAD:improve/security-dogs-ui-20261118
          fi
