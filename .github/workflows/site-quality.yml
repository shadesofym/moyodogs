name: MOYO DOGS Quality Gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: site-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Build, content, tests and production audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - name: Install lockfile dependencies
        run: npm ci
      - name: Validate CMS and content
        run: npm run validate
      - name: Astro and TypeScript validation
        run: npm run check
      - name: Lint scripts and tests
        run: npm run lint
      - name: Build static site
        run: npm run build
      - name: Run regression tests
        run: npm test
      - name: Install Chromium for local preview
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify responsive production build in local preview
        run: |
          npm run preview > /tmp/moyodogs-preview.log 2>&1 &
          curl --retry 20 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:4321/ > /dev/null
          node scripts/smoke-preview.mjs
      - name: Archive preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-screenshots-${{ github.run_number }}
          path: preview-check/
          if-no-files-found: warn
          retention-days: 30
      - name: Audit production dependency advisories
        run: |
          mkdir -p audit-results
          npm audit --omit=dev --json > audit-results/npm-production-audit.json || true
          node scripts/check-production-audit.mjs audit-results/npm-production-audit.json
      - name: Archive production security audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-${{ github.run_number }}
          path: audit-results/npm-production-audit.json
          if-no-files-found: warn
          retention-days: 30
